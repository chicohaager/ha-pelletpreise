name: Validierung

on:
  push:
  pull_request:
  schedule:
    # Einmal wöchentlich, damit eine Änderung an heizpellets24.de oder eine
    # neue Home-Assistant-Version auffällt, bevor jemand ein Ticket aufmacht.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # PyYAML für tests/test_uebersetzungen.py: der Test liest services.yaml
      # und vergleicht die Dienstnamen mit den Sprachdateien.
      - run: pip install pytest pyyaml
      - run: python -m pytest tests/ -v

  ha-tests:
    name: Tests mit laufendem Home Assistant
    runs-on: ubuntu-latest
    # Prüft, was die Offline-Tests nicht sehen können: ob die Entitäten
    # überhaupt entstehen, ob der beobachtete Tief-/Höchstwert einen Neustart
    # übersteht, ob der Dienst greift und ob ein Fehlschlag wirklich keinen
    # Wert liefert. Braucht Python 3.13 — ältere Versionen bekommen von
    # pytest-homeassistant-custom-component nur ein Home Assistant von 2025.1.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      - run: python -m pytest tests/test_sensoren_ha.py -v -o asyncio_mode=auto

  quelle:
    name: Quelle noch lesbar?
    runs-on: ubuntu-latest
    # Prüft gegen die echte Website statt gegen die Fixtures. Schlägt fehl,
    # sobald heizpellets24.de sein Seitenformat ändert — dann ist der Parser
    # anzupassen, bevor Nutzer "unbekannt" in ihren Sensoren sehen.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m pytest tests/test_live.py -v -m live
