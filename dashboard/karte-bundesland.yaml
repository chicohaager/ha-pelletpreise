# Dashboard-Karte für eine Bundesland-Region.
#
# Einsetzen: Dashboard → Bearbeiten → Karte hinzufügen → "Manuell" →
# diesen Text einfügen.
#
# WICHTIG: Die Entitäts-IDs unten sind Beispiele für die Region Bayern.
# Home Assistant vergibt die IDs abhängig vom Gerätenamen und davon, ob das
# Gerät einem Bereich zugeordnet ist — sie können bei dir anders lauten.
# Die tatsächlichen IDs stehen unter
#   Einstellungen → Geräte & Dienste → Pelletpreise → Gerät → Sensoren
# oder in den Entwicklerwerkzeugen unter "Zustände" bei der Suche nach
# "pelletpreise".

type: vertical-stack
cards:
  - type: heading
    heading: Pelletpreise Bayern
    heading_style: title
    icon: mdi:fire
    badges:
      - type: entity
        entity: sensor.pelletpreise_bayern_lose_ware_anderung_zur_vorwoche
        show_state: true

  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.pelletpreise_bayern_lose_ware
        name: Lose Ware
        icon: mdi:tanker-truck
        vertical: false
      - type: tile
        entity: sensor.pelletpreise_bayern_sackware
        name: Sackware
        icon: mdi:package-variant-closed
        vertical: false
      - type: tile
        entity: sensor.pelletpreise_bayern_lose_ware_gesamtpreis
        name: Lose gesamt
        icon: mdi:cash
        vertical: false
      - type: tile
        entity: sensor.pelletpreise_bayern_sackware_gesamtpreis
        name: Sackware gesamt
        icon: mdi:cash
        vertical: false

  # Beobachtete Extremwerte. Sie stammen nicht von heizpellets24.de, sondern
  # aus der Aufzeichnung dieser Installation — deshalb steht "(beobachtet)"
  # im Namen. Seit wann aufgezeichnet wird, steht im Attribut
  # `beobachtet_seit` des jeweiligen Sensors.
  - type: heading
    heading: Seit Beobachtungsbeginn
    heading_style: subtitle
    icon: mdi:chart-timeline-variant

  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.pelletpreise_bayern_lose_ware_tiefstpreis_beobachtet
        name: Lose Tiefstpreis
        icon: mdi:trending-down
        vertical: false
      - type: tile
        entity: sensor.pelletpreise_bayern_lose_ware_hochstpreis_beobachtet
        name: Lose Höchstpreis
        icon: mdi:trending-up
        vertical: false
      - type: tile
        entity: sensor.pelletpreise_bayern_sackware_tiefstpreis_beobachtet
        name: Sack Tiefstpreis
        icon: mdi:trending-down
        vertical: false
      - type: tile
        entity: sensor.pelletpreise_bayern_sackware_hochstpreis_beobachtet
        name: Sack Höchstpreis
        icon: mdi:trending-up
        vertical: false

  # Verlauf. Bewusst `history-graph` statt `statistic-graph`: letzterer
  # meldete auf dem Teststand (HA 2026.8.0) einen Konfigurationsfehler — auch
  # mit fremden Sensoren, die Ursache liegt also außerhalb dieser Integration.
  # Bei diesem Zeitraum greift Home Assistant auf die Langzeitstatistik zurück,
  # die Kurve reicht also weiter als die Aufbewahrungsdauer des Recorders.
  - type: history-graph
    title: Preisverlauf
    hours_to_show: 4320
    entities:
      - entity: sensor.pelletpreise_bayern_lose_ware
        name: Lose Ware
      - entity: sensor.pelletpreise_bayern_sackware
        name: Sackware
